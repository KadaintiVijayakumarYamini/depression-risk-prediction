<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Depression Risk Screener</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; color: #222; }
  .warn { background: #fff4e5; border-left: 4px solid #f5a623; padding: 10px 14px; margin-bottom: 20px; }
  label { display: block; margin-top: 18px; font-weight: bold; }
  select, input[type=range] { width: 100%; margin-top: 6px; }
  button { margin-top: 22px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 22px; padding: 14px; border-radius: 6px; display: none; }
  .high { background: #fdecea; border-left: 4px solid #d93025; }
  .low { background: #e6f4ea; border-left: 4px solid #188038; }
</style>
</head>
<body>
<h1>Student Depression Risk Screener</h1>
<div class="warn">This is a screening aid built for a college project. It is <b>NOT</b> a medical diagnosis.</div>

<label>Have you ever had suicidal thoughts?
  <select id="thoughts"><option value="0">No</option><option value="1">Yes</option></select>
</label>

<label>Academic pressure (1 = low, 5 = high): <span id="aVal">3</span>
  <input type="range" id="academic" min="1" max="5" value="3">
</label>

<label>Financial stress (1 = low, 5 = high): <span id="fVal">3</span>
  <input type="range" id="financial" min="1" max="5" value="3">
</label>

<button onclick="check()">Check risk</button>
<div id="result"></div>

<script>
  document.getElementById("academic").oninput = e => document.getElementById("aVal").textContent = e.target.value;
  document.getElementById("financial").oninput = e => document.getElementById("fVal").textContent = e.target.value;

  // same rules as the trained Decision Tree (depth 3)
  function predict(thoughts, academic, financial) {
    if (thoughts === 0) {
      if (academic <= 3.5) return 0;
      return financial <= 2.5 ? 0 : 1;
    } else {
      if (academic <= 2.5) return financial <= 2.5 ? 0 : 1;
      return 1;
    }
  }

  function check() {
    const t = parseInt(document.getElementById("thoughts").value);
    const a = parseInt(document.getElementById("academic").value);
    const f = parseInt(document.getElementById("financial").value);
    const r = document.getElementById("result");
    r.style.display = "block";
    if (predict(t, a, f) === 1) {
      r.className = "high";
      r.innerHTML = "<b>Higher risk.</b><br>Please consider talking to a counselor, doctor, or someone you trust. In India you can contact Tele-MANAS at 14416 (please verify the number on the official site).";
    } else {
      r.className = "low";
      r.innerHTML = "<b>Lower risk.</b><br>If you are struggling, it's still okay to reach out to a counselor or someone you trust.";
    }
  }
</script>
</body>
</html>
